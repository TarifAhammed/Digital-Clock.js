<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock and stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------- Colour themes (Aurora is the default) ---------- */
  :root, :root[data-theme="aurora"] {
    --page-a: #140f33; --page-b: #0b3a4a;
    --blob-1: rgba(255, 107, 190, 0.32); --blob-2: rgba(64, 224, 208, 0.28);
    --ink: #f4f2ff; --ink-soft: #b9b3e8;
    --case-1: #f3efff; --case-2: #9a8fe0; --case-3: #4a3f9a;
    --bezel: #120c2e;
    --dial-1: #4636b8; --dial-2: #231d6e; --dial-3: #0e1550;
    --num: #ffffff; --tick: #cfc9ff;
    --h-hour: #ff8fc7; --h-min: #7ae8ff; --h-sec: #ffffff;
    --sw: #ffd23f; --on-sw: #2a1d00; --stop: #ff5c7a; --on-stop: #2a0010;
    --win: rgba(8, 6, 40, 0.72); --win-stroke: rgba(255, 255, 255, 0.18);
    --win-text: #ffffff; --win-sub: #b9b3e8;
    --label: #b9b3e8; --label-run: #ffd23f;
    --ghost-bg: rgba(255, 255, 255, 0.08); --line: rgba(244, 242, 255, 0.45);
    --focus: #ffd23f; --shadow: rgba(0, 0, 0, 0.55);
  }
  :root[data-theme="sunset"] {
    --page-a: #2a0a3d; --page-b: #b8322f;
    --blob-1: rgba(255, 190, 80, 0.35); --blob-2: rgba(255, 80, 140, 0.35);
    --ink: #fff5ee; --ink-soft: #ffd6c2;
    --case-1: #fff3cf; --case-2: #e8b040; --case-3: #8a5a12;
    --bezel: #2a0a1f;
    --dial-1: #8f2470; --dial-2: #55124f; --dial-3: #2c0a3a;
    --num: #fff1e6; --tick: #ffd6c2;
    --h-hour: #ffc98a; --h-min: #fff0f6; --h-sec: #ffffff;
    --sw: #2ee6d6; --on-sw: #032b28; --stop: #fff1e6; --on-stop: #3a0a2a;
    --win: rgba(30, 4, 36, 0.72); --win-stroke: rgba(255, 255, 255, 0.2);
    --win-text: #fff1e6; --win-sub: #ffc7b0;
    --label: #ffc7b0; --label-run: #2ee6d6;
    --ghost-bg: rgba(255, 255, 255, 0.1); --line: rgba(255, 245, 238, 0.55);
    --focus: #2ee6d6; --shadow: rgba(40, 0, 20, 0.6);
  }
  :root[data-theme="candy"] {
    --page-a: #ffd9ec; --page-b: #cfeaff;
    --blob-1: rgba(255, 158, 205, 0.55); --blob-2: rgba(140, 190, 255, 0.55);
    --ink: #3b1a55; --ink-soft: #6f4f8f;
    --case-1: #ffffff; --case-2: #d8c8ff; --case-3: #9a82dc;
    --bezel: #4b2a78;
    --dial-1: #ffffff; --dial-2: #fff0fa; --dial-3: #f0dcff;
    --num: #3b1a55; --tick: #8a6ab0;
    --h-hour: #7c4dff; --h-min: #ff3d8b; --h-sec: #00a8cc;
    --sw: #ff8a00; --on-sw: #2b1500; --stop: #3b1a55; --on-stop: #ffffff;
    --win: rgba(59, 26, 85, 0.94); --win-stroke: rgba(255, 255, 255, 0.25);
    --win-text: #ffffff; --win-sub: #dcc9f5;
    --label: #6f4f8f; --label-run: #c2410c;
    --ghost-bg: rgba(255, 255, 255, 0.55); --line: rgba(59, 26, 85, 0.45);
    --focus: #7c4dff; --shadow: rgba(80, 40, 120, 0.35);
  }
  :root[data-theme="ocean"] {
    --page-a: #031d33; --page-b: #0a6a78;
    --blob-1: rgba(64, 220, 200, 0.32); --blob-2: rgba(80, 140, 255, 0.3);
    --ink: #e8fbff; --ink-soft: #a3d9e6;
    --case-1: #e6fbff; --case-2: #6bb7c9; --case-3: #1f6f86;
    --bezel: #03192c;
    --dial-1: #1497b8; --dial-2: #0a5479; --dial-3: #062c4b;
    --num: #ffffff; --tick: #bfeaf5;
    --h-hour: #b8f2e6; --h-min: #ffffff; --h-sec: #9be7ff;
    --sw: #ff7a59; --on-sw: #2b0a02; --stop: #ffffff; --on-stop: #062c4b;
    --win: rgba(2, 24, 44, 0.72); --win-stroke: rgba(255, 255, 255, 0.2);
    --win-text: #ffffff; --win-sub: #a3d9e6;
    --label: #a3d9e6; --label-run: #ff9a7a;
    --ghost-bg: rgba(255, 255, 255, 0.08); --line: rgba(232, 251, 255, 0.5);
    --focus: #ff9a7a; --shadow: rgba(0, 10, 20, 0.6);
  }

  /* ---------- Page ---------- */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    font-family: "Sora", "Century Gothic", "Avenir Next", system-ui, sans-serif;
    background-color: var(--page-b);
    background-image:
      radial-gradient(55% 45% at 15% 8%, var(--blob-1), transparent 70%),
      radial-gradient(50% 45% at 88% 92%, var(--blob-2), transparent 70%),
      linear-gradient(165deg, var(--page-a), var(--page-b));
    background-repeat: no-repeat;
    display: grid;
    place-items: center;
  }
  .stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 24px 16px 30px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 4.5vw, 2.1rem);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  #date { margin: 6px 0 0; color: var(--ink-soft); font-size: 1rem; }

  .watch { width: min(92vw, 58vh, 500px); min-width: 270px; }
  .watch svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 28px 28px var(--shadow));
  }

  /* ---------- Watch parts ---------- */
  .notch { stroke: rgba(0, 0, 0, 0.28); stroke-width: 1.4; }
  .seg { stroke-width: 5.2; stroke-linecap: round; opacity: 0.22; transition: opacity 0.25s; }
  .seg.on { opacity: 1; }
  .tick { stroke: var(--tick); stroke-width: 1.6; opacity: 0.7; }
  .tick.major { stroke-width: 3; opacity: 0.95; }
  .tick.on { stroke: var(--sw); stroke-width: 3.6; opacity: 1; }
  .tick.major.on { stroke-width: 4.4; }
  .numeral {
    fill: var(--num);
    font-family: "Sora", "Century Gothic", "Avenir Next", system-ui, sans-serif;
    font-weight: 600;
    font-size: 20px;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .digits {
    font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 500;
    font-size: 22px;
    text-anchor: middle;
    dominant-baseline: central;
    font-variant-numeric: tabular-nums;
  }
  .digits.clock { fill: var(--win-text); }
  .digits.sw { fill: var(--sw); }
  .ampm {
    fill: var(--win-sub);
    font-family: "Sora", "Century Gothic", system-ui, sans-serif;
    font-weight: 500;
    font-size: 9px;
    text-anchor: end;
    dominant-baseline: central;
  }
  .status {
    fill: var(--label);
    font-family: "Sora", "Century Gothic", system-ui, sans-serif;
    font-weight: 500;
    font-size: 9px;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .status.running { fill: var(--label-run); }
  .pusher { cursor: pointer; transition: transform 0.08s ease-out, filter 0.15s; }
  .pusher:hover { filter: brightness(1.1); }
  .pusher:active { transform: translateY(2.5px); }

  /* ---------- Controls ---------- */
  .controls { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    min-width: 8.75rem;
    height: 3.4rem;
    padding: 0 1.8rem;
    border-radius: 999px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.08s ease-out, background-color 0.2s, opacity 0.2s;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:focus-visible, .swatch:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn.primary {
    background: var(--sw);
    color: var(--on-sw);
    box-shadow: 0 12px 28px -10px var(--sw);
  }
  .btn.primary[data-state="running"] {
    background: var(--stop);
    color: var(--on-stop);
    box-shadow: 0 12px 28px -10px var(--stop);
  }
  .btn.ghost {
    background: var(--ghost-bg);
    color: var(--ink);
    border-color: var(--line);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .btn:disabled { opacity: 0.42; cursor: not-allowed; }

  .themes { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-size: 0.95rem; }
  .swatches { display: flex; gap: 10px; }
  .swatch {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: linear-gradient(135deg, var(--sa) 50%, var(--sb) 50%);
    cursor: pointer;
    transition: transform 0.12s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-checked="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--page-a), 0 0 0 5px var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .btn, .pusher, .swatch, .seg { transition: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <header>
    <h1>Clock and stopwatch</h1>
    <p id="date"></p>
  </header>

  <div class="watch">
    <svg viewBox="-24 -24 448 448" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Round watch face showing the current time, with a digital clock and a stopwatch">
      <defs>
        <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: var(--case-1)"/>
          <stop offset="0.38" style="stop-color: var(--case-2)"/>
          <stop offset="0.62" style="stop-color: var(--case-1)"/>
          <stop offset="1" style="stop-color: var(--case-3)"/>
        </linearGradient>
        <linearGradient id="caseRev" x1="1" y1="1" x2="0" y2="0">
          <stop offset="0" style="stop-color: var(--case-1)"/>
          <stop offset="0.5" style="stop-color: var(--case-2)"/>
          <stop offset="1" style="stop-color: var(--case-3)"/>
        </linearGradient>
        <radialGradient id="dialGrad" cx="0.38" cy="0.3" r="0.85">
          <stop offset="0" style="stop-color: var(--dial-1)"/>
          <stop offset="0.6" style="stop-color: var(--dial-2)"/>
          <stop offset="1" style="stop-color: var(--dial-3)"/>
        </radialGradient>
        <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="dialClip"><circle cx="200" cy="200" r="160"/></clipPath>
        <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.4"/>
        </filter>
      </defs>

      <!-- Crown (3 o'clock) and pushers (2 and 4 o'clock), drawn under the case -->
      <g transform="rotate(90 200 200)" aria-hidden="true">
        <rect x="184" y="-12" width="32" height="18" rx="4" fill="url(#caseRev)"/>
        <g stroke="rgba(0,0,0,.3)" stroke-width="1.5">
          <line x1="190" y1="-10" x2="190" y2="4"/><line x1="196" y1="-10" x2="196" y2="4"/>
          <line x1="202" y1="-10" x2="202" y2="4"/><line x1="208" y1="-10" x2="208" y2="4"/>
        </g>
      </g>
      <g transform="rotate(58 200 200)" aria-hidden="true">
        <g class="pusher" id="pusherStart">
          <title>Start / stop</title>
          <rect x="189" y="-10" width="22" height="18" rx="4" fill="url(#caseRev)"/>
          <rect x="189" y="-10" width="22" height="6" rx="3" style="fill: var(--sw)"/>
        </g>
      </g>
      <g transform="rotate(122 200 200)" aria-hidden="true">
        <g class="pusher" id="pusherReset">
          <title>Reset</title>
          <rect x="189" y="-10" width="22" height="18" rx="4" fill="url(#caseRev)"/>
          <rect x="189" y="-10" width="22" height="6" rx="3" fill="rgba(255,255,255,.55)"/>
        </g>
      </g>

      <!-- Case, knurled edge and dark bezel -->
      <circle cx="200" cy="200" r="196" fill="url(#caseGrad)"/>
      <circle cx="200" cy="200" r="196" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/>
      <g id="notches"></g>
      <circle cx="200" cy="200" r="189" style="fill: var(--bezel)" stroke="rgba(0,0,0,.45)" stroke-width="2"/>

      <!-- Rainbow ring: the current second of the clock -->
      <g id="ring"></g>

      <!-- Dial -->
      <circle cx="200" cy="200" r="160" fill="url(#dialGrad)"/>
      <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="3"/>
      <g id="ticks"></g>
      <g id="numerals"></g>

      <!-- Digital windows -->
      <rect x="132" y="116" width="136" height="34" rx="10" style="fill: var(--win); stroke: var(--win-stroke)"/>
      <text id="clockText" class="digits clock" x="190" y="133.5">00:00:00</text>
      <text id="ampm" class="ampm" x="262" y="134">AM</text>

      <rect x="132" y="252" width="136" height="34" rx="10" style="fill: var(--win); stroke: var(--win-stroke)"/>
      <text id="swText" class="digits sw" x="200" y="269.5">00:00.00</text>
      <text id="status" class="status" x="200" y="297.5">Stopwatch ready</text>

      <!-- Hands -->
      <g filter="url(#handShadow)">
        <g id="hourHand">
          <path d="M200 106 L207 126 L207 212 L193 212 L193 126 Z" style="fill: var(--h-hour)" stroke="rgba(0,0,0,.35)"/>
          <rect x="198" y="128" width="4" height="56" rx="2" fill="rgba(255,255,255,.55)"/>
        </g>
        <g id="minuteHand">
          <path d="M200 64 L205 86 L205 212 L195 212 L195 86 Z" style="fill: var(--h-min)" stroke="rgba(0,0,0,.35)"/>
          <rect x="198.3" y="90" width="3.4" height="96" rx="1.7" fill="rgba(255,255,255,.55)"/>
        </g>
        <g id="clockSecondHand">
          <line x1="200" y1="52" x2="200" y2="236" style="stroke: var(--h-sec)" stroke-width="1.6"/>
          <circle cx="200" cy="228" r="4" style="fill: var(--h-sec)"/>
        </g>
        <g id="stopwatchHand">
          <path d="M200 44 L205.5 66 L194.5 66 Z" style="fill: var(--sw)"/>
          <line x1="200" y1="64" x2="200" y2="214" style="stroke: var(--sw)" stroke-width="3.4"/>
          <rect x="196.5" y="212" width="7" height="28" rx="3.5" style="fill: var(--sw)"/>
        </g>
        <circle cx="200" cy="200" r="10" style="fill: var(--sw)" stroke="rgba(0,0,0,.4)"/>
        <circle cx="200" cy="200" r="4" style="fill: var(--dial-3)"/>
      </g>

      <!-- Glass sheen -->
      <g clip-path="url(#dialClip)" pointer-events="none">
        <ellipse cx="150" cy="70" rx="150" ry="80" transform="rotate(-28 150 70)" fill="url(#glare)"/>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="toggleBtn" class="btn primary" type="button" data-state="stopped">Start</button>
    <button id="resetBtn" class="btn ghost" type="button" disabled>Reset</button>
  </div>

  <div class="themes">
    <span id="themeName">Aurora</span>
    <div class="swatches" role="radiogroup" aria-label="Colour theme">
      <button type="button" class="swatch" role="radio" aria-checked="true"  aria-label="Aurora"  data-theme-name="aurora" style="--sa:#4636b8; --sb:#ff8fc7"></button>
      <button type="button" class="swatch" role="radio" aria-checked="false" aria-label="Sunset"  data-theme-name="sunset" style="--sa:#b8322f; --sb:#ffc98a"></button>
      <button type="button" class="swatch" role="radio" aria-checked="false" aria-label="Candy"   data-theme-name="candy"  style="--sa:#ffb3d9; --sb:#7c4dff"></button>
      <button type="button" class="swatch" role="radio" aria-checked="false" aria-label="Ocean"   data-theme-name="ocean"  style="--sa:#0a6a78; --sb:#ff7a59"></button>
    </div>
  </div>
</main>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var C = 200;

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function polar(r, deg) {
    var a = deg * Math.PI / 180;
    return [C + r * Math.sin(a), C - r * Math.cos(a)];
  }
  function pad(n, len) { return String(n).padStart(len || 2, "0"); }
  function rotate(node, deg) { node.setAttribute("transform", "rotate(" + deg + " 200 200)"); }

  /* ---------- Build the watch ---------- */
  var i;
  var notches = document.getElementById("notches");
  for (i = 0; i < 90; i++) {
    var n1 = polar(191, i * 4), n2 = polar(195, i * 4);
    el("line", { x1: n1[0], y1: n1[1], x2: n2[0], y2: n2[1], "class": "notch" }, notches);
  }

  var ring = document.getElementById("ring");
  var segEls = [];
  for (i = 0; i < 60; i++) {
    var s1 = polar(166, i * 6), s2 = polar(184, i * 6);
    segEls.push(el("line", { x1: s1[0], y1: s1[1], x2: s2[0], y2: s2[1], "class": "seg" }, ring));
  }

  var ticks = document.getElementById("ticks");
  var tickEls = [];
  for (i = 0; i < 60; i++) {
    var major = i % 5 === 0;
    var t1 = polar(major ? 138 : 147, i * 6), t2 = polar(154, i * 6);
    tickEls.push(el("line", { x1: t1[0], y1: t1[1], x2: t2[0], y2: t2[1], "class": major ? "tick major" : "tick" }, ticks));
  }

  var numerals = document.getElementById("numerals");
  for (var h = 1; h <= 12; h++) {
    var pos = polar(112, h * 30);
    var label = el("text", { x: pos[0], y: pos[1], "class": "numeral" }, numerals);
    label.textContent = h;
  }

  /* ---------- References ---------- */
  var hourHand = document.getElementById("hourHand");
  var minuteHand = document.getElementById("minuteHand");
  var clockSecondHand = document.getElementById("clockSecondHand");
  var stopwatchHand = document.getElementById("stopwatchHand");
  var clockText = document.getElementById("clockText");
  var ampmText = document.getElementById("ampm");
  var swText = document.getElementById("swText");
  var statusText = document.getElementById("status");
  var dateText = document.getElementById("date");
  var toggleBtn = document.getElementById("toggleBtn");
  var resetBtn = document.getElementById("resetBtn");

  /* ---------- Themes ---------- */
  var THEMES = {
    aurora: { label: "Aurora", h0: 150, hs: 3.4 },
    sunset: { label: "Sunset", h0: 350, hs: 1.9 },
    candy:  { label: "Candy",  h0: 300, hs: 6 },
    ocean:  { label: "Ocean",  h0: 165, hs: 1.8 }
  };
  var swatches = document.querySelectorAll(".swatch");
  var themeName = document.getElementById("themeName");

  function applyTheme(name, remember) {
    var theme = THEMES[name];
    if (!theme) { name = "aurora"; theme = THEMES.aurora; }
    document.documentElement.setAttribute("data-theme", name);
    for (var k = 0; k < segEls.length; k++) {
      var hue = (((theme.h0 + k * theme.hs) % 360) + 360) % 360;
      segEls[k].style.stroke = "hsl(" + hue.toFixed(1) + ", 95%, 62%)";
    }
    for (var s = 0; s < swatches.length; s++) {
      swatches[s].setAttribute("aria-checked", swatches[s].getAttribute("data-theme-name") === name ? "true" : "false");
    }
    themeName.textContent = theme.label;
    if (remember) {
      try { localStorage.setItem("chrono-theme", name); } catch (e) {}
    }
  }
  for (var w = 0; w < swatches.length; w++) {
    swatches[w].addEventListener("click", function () {
      applyTheme(this.getAttribute("data-theme-name"), true);
    });
  }
  var saved = null;
  try { saved = localStorage.getItem("chrono-theme"); } catch (e) {}
  applyTheme(saved, false);

  /* ---------- Clock (setInterval, always running) ---------- */
  var lastSecond = -1;
  function updateClock() {
    var now = new Date();
    var hr = now.getHours(), min = now.getMinutes(), sec = now.getSeconds();

    rotate(hourHand, (hr % 12) * 30 + min * 0.5 + sec / 120);
    rotate(minuteHand, min * 6 + sec * 0.1);
    rotate(clockSecondHand, sec * 6);

    clockText.textContent = pad(hr % 12 || 12) + ":" + pad(min) + ":" + pad(sec);
    ampmText.textContent = hr >= 12 ? "PM" : "AM";

    if (sec !== lastSecond) {
      lastSecond = sec;
      for (var k = 0; k < segEls.length; k++) {
        segEls[k].classList.toggle("on", k <= sec);
      }
      dateText.textContent = now.toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    }
  }
  updateClock();
  setInterval(updateClock, 200);

  /* ---------- Stopwatch (setInterval / clearInterval) ---------- */
  var swTimer = null;   // interval id, null while stopped
  var swStartedAt = 0;  // performance.now() reference point
  var swElapsed = 0;    // milliseconds accumulated
  var lastSwSecond = -2;

  function formatStopwatch(ms) {
    var hours = Math.floor(ms / 3600000);
    var minutes = Math.floor(ms / 60000) % 60;
    var seconds = Math.floor(ms / 1000) % 60;
    var centis = Math.floor(ms / 10) % 100;
    if (hours > 0) {
      return hours + ":" + pad(minutes) + ":" + pad(seconds) + "." + Math.floor(centis / 10);
    }
    return pad(minutes) + ":" + pad(seconds) + "." + pad(centis);
  }

  function renderStopwatch(ms) {
    swText.textContent = formatStopwatch(ms);
    rotate(stopwatchHand, (ms % 60000) / 60000 * 360);

    var lit = ms > 0 ? Math.floor((ms % 60000) / 1000) : -1;
    if (lit !== lastSwSecond) {
      lastSwSecond = lit;
      for (var k = 0; k < tickEls.length; k++) {
        tickEls[k].classList.toggle("on", k <= lit);
      }
    }
  }

  function refreshControls() {
    var running = swTimer !== null;
    toggleBtn.textContent = running ? "Stop" : "Start";
    toggleBtn.setAttribute("data-state", running ? "running" : "stopped");
    resetBtn.disabled = !running && swElapsed === 0;
    statusText.textContent = running ? "Stopwatch running" : (swElapsed > 0 ? "Stopwatch stopped" : "Stopwatch ready");
    statusText.setAttribute("class", running ? "status running" : "status");
  }

  function tickStopwatch() {
    swElapsed = performance.now() - swStartedAt;
    renderStopwatch(swElapsed);
  }

  function toggleStopwatch() {
    if (swTimer === null) {
      swStartedAt = performance.now() - swElapsed;
      swTimer = setInterval(tickStopwatch, 10);
    } else {
      clearInterval(swTimer);
      swTimer = null;
      swElapsed = performance.now() - swStartedAt;
      renderStopwatch(swElapsed);
    }
    refreshControls();
  }

  function resetStopwatch() {
    if (swTimer !== null) {
      clearInterval(swTimer);
      swTimer = null;
    }
    swElapsed = 0;
    renderStopwatch(0);
    refreshControls();
  }

  toggleBtn.addEventListener("click", toggleStopwatch);
  resetBtn.addEventListener("click", resetStopwatch);
  document.getElementById("pusherStart").addEventListener("click", toggleStopwatch);
  document.getElementById("pusherReset").addEventListener("click", resetStopwatch);

  renderStopwatch(0);
  refreshControls();
})();
</script>
</body>
</html>
